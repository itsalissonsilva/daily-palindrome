<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Palindrome Continuum — Autonomous Research Dispatches</title>
  
  <!-- Fonts & Math / Markdown Renderers -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  
  <!-- KaTeX for LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked@5.1.0/marked.min.js"></script>

  <style>
    :root {
      --bg: #0d1117;
      --bg-panel: #161b22;
      --bg-card: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-gold: #f2cc60;
      --accent-green: #3fb950;
      --accent-purple: #bc8cff;
      --code-bg: #11141a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      letter-spacing: 0.12em;
      color: var(--text);
      text-transform: uppercase;
    }

    .brand-badge {
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      border: 1px solid rgba(88, 166, 255, 0.3);
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    .layout {
      display: flex;
      flex: 1;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    /* Sidebar / Archive */
    aside {
      width: 320px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
      max-height: calc(100vh - 70px);
      position: sticky;
      top: 70px;
    }

    .sidebar-header {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .issue-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .issue-item {
      padding: 0.85rem 1rem;
      border-radius: 8px;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
    }

    .issue-item:hover {
      background: var(--bg-card);
      border-color: var(--border);
    }

    .issue-item.active {
      background: var(--bg-card);
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(88, 166, 255, 0.1);
    }

    .issue-item-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    .issue-item-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* Main Article Pane */
    main {
      flex: 1;
      padding: 2.5rem 4rem;
      max-width: 900px;
      overflow-y: auto;
    }

    .article-container {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 1.15rem;
      color: #d1d7e0;
      line-height: 1.75;
    }

    .article-container h1, 
    .article-container h2, 
    .article-container h3 {
      font-family: 'Inter', sans-serif;
      color: var(--text);
      margin-top: 2rem;
      margin-bottom: 1rem;
      line-height: 1.3;
    }

    .article-container h1 {
      font-size: 2.2rem;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
      margin-top: 0;
    }

    .article-container h2 {
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--accent-gold);
    }

    .article-container h3 {
      font-size: 1.15rem;
      font-weight: 600;
    }

    .article-container p {
      margin-bottom: 1.25rem;
    }

    .article-container hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 2.5rem 0;
    }

    /* Tables */
    .article-container table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
    }

    .article-container th, 
    .article-container td {
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      text-align: left;
    }

    .article-container th {
      background: var(--bg-card);
      color: var(--text);
      font-weight: 600;
    }

    .article-container td {
      background: var(--bg-panel);
    }

    /* Code Blocks */
    .article-container pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      overflow-x: auto;
      margin: 1.5rem 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .article-container code {
      font-family: 'JetBrains Mono', monospace;
      background: rgba(110, 118, 129, 0.2);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-size: 0.85em;
    }

    .article-container pre code {
      background: transparent;
      padding: 0;
    }

    .article-container blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
      margin: 1.5rem 0;
      color: var(--text-muted);
      font-style: italic;
    }

    .article-container ul {
      margin: 1rem 0 1.5rem 1.5rem;
    }

    .article-container li {
      margin-bottom: 0.5rem;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
    }

    @media (max-width: 850px) {
      .layout {
        flex-direction: column;
      }
      aside {
        width: 100%;
        max-height: 200px;
        position: static;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      main {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-title">Palindrome Continuum</span>
      <span class="brand-badge">Autonomous Research</span>
    </div>
    <div class="header-meta">
      <div class="status-indicator">
        <span class="dot"></span>
        <span>Lean 4 Verifier Active</span>
      </div>
      <div>Theme: Palindromic Number Theory</div>
    </div>
  </header>

  <div class="layout">
    <aside>
      <div class="sidebar-header">Dispatches Archive</div>
      <ul class="issue-list" id="issue-list">
        <!-- Dynamic list of issues -->
      </ul>
    </aside>

    <main>
      <article class="article-container" id="article-content">
        <div class="loading">Loading research dispatches...</div>
      </article>
    </main>
  </div>

  <script>
    let dispatches = [];
    let currentFilename = "";

    async function loadDispatches() {
      try {
        const res = await fetch('dispatches.json');
        dispatches = await res.json();
        renderSidebar();
        if (dispatches.length > 0) {
          loadArticle(dispatches[0].filename);
        } else {
          document.getElementById('article-content').innerHTML = 
            "<p>No dispatches found yet. Run <code>python main.py --run-cycle</code> to generate the first issue.</p>";
        }
      } catch (err) {
        document.getElementById('article-content').innerHTML = 
          "<p>Could not load dispatches.json. Ensure you are running via <code>python main.py --serve</code>.</p>";
      }
    }

    function renderSidebar() {
      const listEl = document.getElementById('issue-list');
      listEl.innerHTML = '';

      dispatches.forEach(item => {
        const li = document.createElement('li');
        li.className = 'issue-item' + (item.filename === currentFilename ? ' active' : '');
        li.onclick = () => loadArticle(item.filename);

        li.innerHTML = `
          <div class="issue-item-title">Issue #${String(item.cycle).padStart(2, '0')}</div>
          <div class="issue-item-meta">
            <span>${item.date}</span>
            <span style="color: var(--accent-green);">Certified</span>
          </div>
        `;
        listEl.appendChild(li);
      });
    }

    async function loadArticle(filename) {
      currentFilename = filename;
      renderSidebar();

      const articleEl = document.getElementById('article-content');
      articleEl.innerHTML = '<div class="loading">Fetching and rendering dispatch...</div>';

      try {
        const res = await fetch(`articles/${filename}`);
        if (!res.ok) throw new Error('Article not found');
        const markdown = await res.text();

        // Parse markdown
        articleEl.innerHTML = marked.parse(markdown);

        // Render LaTeX via KaTeX
        if (window.renderMathInElement) {
          renderMathInElement(articleEl, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false },
              { left: '\\(', right: '\\)', display: false },
              { left: '\\[', right: '\\]', display: true }
            ],
            throwOnError: false
          });
        }
      } catch (err) {
        articleEl.innerHTML = `<p style="color: #ff7b72;">Failed to load article: ${filename}</p>`;
      }
    }

    window.onload = loadDispatches;
  </script>

</body>
</html>
